name: Build NoitaChestFinder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libpng-dev build-essential

    - name: Build project
      run: |
        make NoitaChestFinder

    - name: Test build
      run: |
        ./NoitaChestFinder --help || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NoitaChestFinder
        path: NoitaChestFinder
