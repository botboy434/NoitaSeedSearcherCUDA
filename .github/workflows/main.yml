name: Build NoitaChestFinder

on:
  push:
    branches: [ rewrite-2 ]
  pull_request:
    branches: [ rewrite-2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        choco install -y llvm
        choco install -y mingw
        # Install any other required libraries if needed

    - name: Build project
      shell: bash
      run: |
        make NoitaChestFinder

    - name: Test build
      shell: bash
      run: |
        ./NoitaChestFinder.exe --help || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NoitaChestFinder
        path: NoitaChestFinder.exe
